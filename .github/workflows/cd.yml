name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build the image locally first so we can run/test it before pushing ---
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Run the container and smoke-test the /health endpoint ---
      - name: Run container
        run: |
          docker run -d --name app-test -p 5000:5000 local/app:test
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health; then
              echo "App is up!"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "App failed to start in time"
              docker logs app-test
              exit 1
            fi
            sleep 2
          done

      - name: Verify root endpoint
        run: |
          curl -sf http://localhost:5000/ | tee response.json
          grep -q "Hello from the app" response.json

      - name: Show container logs
        if: always()
        run: docker logs app-test

      - name: Stop and remove container
        if: always()
        run: docker rm -f app-test || true

      # --- Only push on pushes to main (not on PRs) ---
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- CD: automatically deploy the freshly-pushed image to your server ---
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Optional, only needed if sshd runs on a non-default port
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull app
            docker compose up -d app
            docker image prune -f
