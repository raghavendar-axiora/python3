name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run app import check
        run: |
          python -c "import app"

      - name: Build Docker image
        run: |
          docker build -t my-flask-app:${{ github.sha }} .

      - name: Run container smoke test
        run: |
          docker run -d -p 5000:5000 --name test-app my-flask-app:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health || (docker logs test-app && exit 1)
          docker stop test-app
