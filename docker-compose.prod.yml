version: "3.9"

services:
  app:
    image: ghcr.io/raghavendar-axiora/python3:latest
    container_name: app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
